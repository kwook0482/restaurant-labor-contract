<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음식점 근로계약서 작성 도우미</title>
<style>
:root{--blue:#1458d4;--blue2:#0b46b5;--ink:#172b4d;--muted:#53657e;--line:#cbd8e8;--pale:#edf4ff;--bg:#f3f6fb;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:17px max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-weight:900;font-size:21px;color:#102c59;letter-spacing:-.6px}.brand span{color:var(--blue)}
.topnote{font-size:13px;color:var(--muted);font-weight:700}
.wrap{max-width:1180px;margin:26px auto;padding:0 18px 38px}
.hero{background:linear-gradient(110deg,#e6f0ff,#fff 72%);border:1px solid #d5e3f6;border-radius:18px;padding:25px 28px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero h1{font-size:27px;line-height:1.3;margin:0 0 8px;font-weight:900;letter-spacing:-.8px}.hero p{margin:0;color:#354d70;font-weight:600}.hero-mark{font-size:48px;flex-shrink:0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.step-chip{display:flex;align-items:center;gap:9px;padding:12px 10px;background:#e5ebf4;border:1px solid #d3deeb;border-radius:12px;color:#435773;font-size:13px;font-weight:800}
.step-chip .num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#53657e;font-size:15px;flex-shrink:0}
.step-chip.active{background:#eaf2ff;border-color:#7aa9ff;color:#103d91}.step-chip.active .num,.step-chip.done .num{background:var(--blue);color:#fff}.step-chip.done{background:#f2f7ff;color:#244b8d}
.card{background:#fff;border:1px solid #d8e2ef;border-radius:16px;box-shadow:0 5px 18px rgba(20,48,90,.05);overflow:hidden}
.card-head{padding:19px 24px;border-bottom:1px solid #e0e8f2;display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-head h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px}.stepcount{font-size:13px;font-weight:800;color:var(--blue);white-space:nowrap}
.card-body{padding:24px}
.intro{color:#4b5f7b;margin:0 0 21px;font-weight:600}
.section-title{font-size:17px;font-weight:900;margin:23px 0 12px;color:#183967}.section-title:first-child{margin-top:0}
.worker-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.worker-option{border:2px solid #d5dfec;border-radius:13px;padding:17px;display:flex;gap:13px;align-items:center;background:#fff;text-align:left;color:var(--ink)}
.worker-option strong{display:block;font-size:17px;font-weight:900}.worker-option small{display:block;color:var(--muted);font-size:13px;margin-top:3px}.worker-option .symbol{font-size:27px}.worker-option.selected{border-color:var(--blue);background:#f0f6ff;box-shadow:0 0 0 2px #dceaff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 18px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:14px;font-weight:900;color:#263e60}.required{color:#c62828}
input,select,textarea{width:100%;border:1.5px solid #bccbde;border-radius:9px;padding:11px 12px;color:#172b4d;background:#fff;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dce9ff}
.hint{font-size:12px;color:#5c6e86;margin-top:2px}
.notice{margin-top:16px;background:#edf5ff;border:1px solid #d0e3ff;border-radius:10px;padding:12px 14px;color:#254a7e;font-size:13px;font-weight:700}
.day-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}.day-table th,.day-table td{border:1px solid #d5dfec;padding:8px;text-align:center}.day-table th{background:#eef4fc;font-weight:900}.day-table input{min-width:80px;padding:7px 8px;min-height:36px}
.day-checks{display:flex;gap:8px;flex-wrap:wrap}.day-check{display:flex;align-items:center;gap:5px;border:1px solid #c7d5e7;padding:7px 10px;border-radius:8px;font-weight:800;font-size:14px}.day-check input{width:16px;min-height:16px;height:16px;margin:0}
.inline-options{display:flex;gap:15px;flex-wrap:wrap}.inline-options label{display:flex;align-items:center;gap:7px;font-weight:700}.inline-options input{width:17px;min-height:17px;height:17px}
.actions{display:flex;justify-content:space-between;gap:12px;padding:18px 24px;background:#f8faff;border-top:1px solid #e0e8f2}
.btn{border:1px solid #b8c9e0;border-radius:10px;padding:11px 20px;font-weight:900;color:#203b61;background:#fff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.review-block{border:1px solid #d6e0ed;border-radius:11px;overflow:hidden}.review-block h3{margin:0;background:#edf4ff;padding:11px 13px;font-size:15px;font-weight:900}.review-block dl{display:grid;grid-template-columns:112px 1fr;margin:0}.review-block dt,.review-block dd{padding:8px 11px;border-top:1px solid #e7edf5;margin:0;font-size:13px;overflow-wrap:anywhere}.review-block dt{background:#fafcff;font-weight:800;color:#425774}.checkline{display:flex;gap:9px;align-items:flex-start;margin-top:17px;font-weight:700}.checkline input{width:18px;min-height:18px;height:18px;margin-top:4px}
.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.signature-box{border:1px solid #cbd8e8;border-radius:13px;padding:15px}.signature-box h3{margin:0 0 4px;font-size:17px;font-weight:900}.signature-box p{margin:0 0 10px;font-size:13px;color:var(--muted)}canvas.signature{width:100%;height:170px;display:block;border:1.5px dashed #9fb4d0;border-radius:9px;background:#fff;touch-action:none;cursor:crosshair}.sig-actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px}.sig-status{font-size:12px;font-weight:800;color:#64748b}.sig-status.ok{color:#147d45}
.contract{max-width:820px;margin:0 auto;border:1px solid #d7e0eb;border-radius:8px;background:#fff;padding:30px 34px;color:#172033;box-shadow:0 3px 14px rgba(20,48,90,.07);font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif}
.contract h2{text-align:center;font-size:26px;font-weight:900;letter-spacing:9px;margin:0 0 22px;color:#101f38;padding-bottom:14px;border-bottom:2px solid #253b5b}
.contract p{font-size:14px;line-height:1.85;margin:12px 0 16px}.contract ol{padding-left:24px;margin:18px 0}.contract li{margin:0 0 10px;font-size:14px;line-height:1.75;padding-left:2px}
.contract-table{border-collapse:collapse;width:100%;font-size:13px;margin:18px 0 20px}.contract-table th,.contract-table td{border:1px solid #b8c5d6;padding:10px 11px;text-align:left;vertical-align:top;line-height:1.55}.contract-table th{background:#edf3fa;width:145px;font-weight:900;color:#243b5b}.contract-table .info-section th{background:#dbe7f5;color:#183553;font-size:13px;border-top:2px solid #879bb5;padding:9px 11px}
.signatures-print{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:28px;break-inside:avoid}.print-sign{border-top:1px solid #7d8ba0;padding-top:10px;min-height:110px;font-size:13px;line-height:1.7}.print-sign img{display:block;object-fit:contain;object-position:left center;width:100%;height:70px;margin-top:2px}
.output-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px auto 4px}.output-actions .btn{min-width:190px;display:inline-flex;justify-content:center;align-items:center;gap:8px}.output-tip{max-width:820px;margin:12px auto 0;font-size:13px;color:#415875;background:#edf5ff;border:1px solid #d5e6ff;padding:12px 15px;border-radius:10px}
.completion{background:#edf9f1;border:1px solid #b9e5c8;color:#155c31;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-weight:800}
.footer-note{font-size:12px;color:#60718a;margin:18px 2px 0}
.hidden{display:none!important}
@media(max-width:780px){.topbar{padding:14px 16px}.brand{font-size:17px}.topnote{display:none}.wrap{margin:14px auto;padding:0 10px 24px}.hero{padding:19px}.hero h1{font-size:22px}.hero-mark{font-size:36px}.steps{grid-template-columns:1fr;gap:6px}.step-chip{padding:7px 10px}.step-chip:not(.active):not(.done){display:none}.card-head,.card-body{padding:17px}.card-head h2{font-size:19px}.grid,.grid.three,.review-grid,.signature-grid{grid-template-columns:1fr}.worker-options{grid-template-columns:1fr}.actions{padding:14px 16px}.btn{padding:10px 14px}.contract{padding:22px 16px}.contract h2{letter-spacing:4px;font-size:21px}.contract-table th,.contract-table td{padding:7px 6px;font-size:12px}.contract-table th{width:105px}.review-block dl{grid-template-columns:95px 1fr}.day-table{font-size:11px}.day-table th,.day-table td{padding:4px}.day-table input{min-width:55px;font-size:12px}.signatures-print{gap:12px}.output-actions{display:grid;grid-template-columns:1fr}.output-actions .btn{width:100%;min-width:0}}
@media print{
  @page{size:auto;margin:10mm}
  html,body{background:#fff!important;margin:0!important;padding:0!important;width:100%!important}
  .topbar,.hero,.steps,.card-head,.actions,.footer-note,.no-print,.output-actions,.output-tip,.completion{display:none!important}
  .wrap{width:100%!important;max-width:none!important;margin:0!important;padding:0!important}
  .card{border:0!important;box-shadow:none!important;overflow:visible!important}
  .card-body{padding:0!important}
  .contract{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;box-shadow:none!important;border:0!important;border-radius:0!important;color:#000!important;overflow:visible!important}
  .contract h2{font-size:22pt;letter-spacing:4px}
  .contract li,.contract p{font-size:10.5pt}
  .contract-table{font-size:10pt;break-inside:avoid}
  .contract-table th,.contract-table td{padding:6px}
  .signatures-print{break-inside:avoid}
  .print-sign img{height:58px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🍴 음식점 <span>근로계약서</span> 작성 도우미</div>
  <div class="topnote">간편하게 · 정확하게 · 안전하게</div>
</header>
<main class="wrap">
  <section class="hero">
    <div><h1>음식점 사장님의 근로계약서 작성을 도와드립니다.</h1><p>필요한 정보를 순서대로 입력하고, 계약 내용을 확인한 뒤 서명된 계약서를 완성하세요.</p></div>
    <div class="hero-mark" aria-hidden="true">📝</div>
  </section>
  <nav class="steps" id="steps" aria-label="작성 단계"></nav>
  <section class="card">
    <div class="card-head"><h2 id="stepTitle">1. 근로자 유형·기본정보</h2><span class="stepcount" id="stepCount">1 / 5</span></div>
    <div class="card-body" id="stepContent"></div>
    <div class="actions" id="actions"><button class="btn" id="backBtn" type="button">이전</button><button class="btn primary" id="nextBtn" type="button">다음 단계 →</button></div>
  </section>
  <p class="footer-note">안내: 이 도구는 계약서 작성을 보조합니다. 실제 근로조건과 관련 법령을 확인한 후 사용하세요. 입력 내용은 현재 브라우저 화면에서 처리되며, 이 기본 버전은 서버에 전송하지 않습니다.</p>
</main>
<script>
const titles=['근로자 유형·기본정보','근로조건·근무시간','임금·휴가·사회보험','계약 내용 확인·서명','계약서 완성·출력'];
const state={
 workerType:'regular',
 employer:{name:'',representative:'',address:'',phone:''},
 employee:{name:'',address:'',phone:''},
 work:{startDate:'',place:'',duties:'',startTime:'09:00',endTime:'18:00',breakStart:'12:00',breakEnd:'13:00',days:['월','화','수','목','금'],weeklyHoliday:'일요일',dailyHours:{}},
 pay:{type:'시급',amount:'',cycle:'매월',payDate:'매월 10일',method:'계좌이체',bonus:'없음',allowance:''},
 benefits:{annualLeave:'법령 기준에 따름',insurance:{employment:true,industrial:true,pension:true,health:true}},
 confirmed:false, employeeSignature:'', employerSignature:''
};
// 사업장 정보만 현재 브라우저에 저장합니다. 근로자 정보와 계약 기록은 저장하지 않습니다.
const EMPLOYER_STORAGE_KEY='restaurantEmploymentHelperEmployer_v1';
try {
 const savedEmployer=JSON.parse(localStorage.getItem(EMPLOYER_STORAGE_KEY)||'null');
 if(savedEmployer && typeof savedEmployer==='object') {
  ['name','representative','address','phone'].forEach(k=>{
   if(typeof savedEmployer[k]==='string') state.employer[k]=savedEmployer[k];
  });
 }
} catch(e) { console.warn('사업장 정보를 불러오지 못했습니다.',e); }
function saveEmployerInfo(){
 try { localStorage.setItem(EMPLOYER_STORAGE_KEY,JSON.stringify(state.employer)); }
 catch(e) { console.warn('사업장 정보를 저장하지 못했습니다.',e); }
}
let step=0;
const dayNames=['월','화','수','목','금','토','일'];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(label,path,value,type='text',placeholder='',required=false,extra=''){
 return `<div class="field"><label>${label}${required?' <span class="required">*</span>':''}</label><input ${extra} data-path="${path}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?'required':''}></div>`;
}
function selectField(label,path,value,options){
 return `<div class="field"><label>${label}</label><select data-path="${path}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
}
function renderSteps(){
 $('steps').innerHTML=titles.map((t,i)=>`<div class="step-chip ${i===step?'active':i<step?'done':''}"><span class="num">${i<step?'✓':i+1}</span><span>${t}</span></div>`).join('');
 $('stepTitle').textContent=(step+1)+'. '+titles[step];$('stepCount').textContent=(step+1)+' / 5';
 $('backBtn').disabled=step===0;$('nextBtn').textContent=step===4?'처음으로 돌아가기':'다음 단계 →';
 $('nextBtn').classList.toggle('primary',true);
}
function render(){
 renderSteps();
 const c=$('stepContent');
 if(step===0)c.innerHTML=`
 <p class="intro">먼저 근로자 유형을 선택하고 사업주와 근로자 정보를 입력해 주세요.</p>
 <div class="section-title">1. 어떤 근로자의 계약서를 작성하시겠습니까?</div>
 <div class="worker-options">
 <button type="button" class="worker-option ${state.workerType==='regular'?'selected':''}" data-worker="regular"><span class="symbol">👤</span><span><strong>일반 근로자</strong><small>정규직, 계약직 등</small></span></button>
 <button type="button" class="worker-option ${state.workerType==='parttime'?'selected':''}" data-worker="parttime"><span class="symbol">🕒</span><span><strong>단시간 근로자</strong><small>파트타임 등</small></span></button>
 </div>
 <div class="section-title">2. 사업주 정보</div><div class="grid">
 ${field('사업장명','employer.name',state.employer.name,'text','예) 행복한식당',true)}
 ${field('대표자명','employer.representative',state.employer.representative,'text','예) 김사장',true)}
 ${field('사업장 주소','employer.address',state.employer.address,'text','사업장 주소',true)}
 ${field('연락처','employer.phone',state.employer.phone,'tel','예) 02-1234-5678',true)}
 </div>
 <p class="hint">사업장 정보는 이 브라우저에 자동 저장되어 다음 근로계약서 작성 때 다시 입력하지 않아도 됩니다. 공용 기기에서는 사용에 유의해 주세요.</p>
 <div class="section-title">3. 근로자 정보</div><div class="grid">
 ${field('근로자 성명','employee.name',state.employee.name,'text','근로자 성명',true)}
 ${field('주소','employee.address',state.employee.address,'text','근로자 주소')}
 ${field('연락처','employee.phone',state.employee.phone,'tel','연락처',true)}
 </div>
 <div class="notice">※ 이 기본 버전은 만 18세 미만, 건설일용 및 외국인 근로자를 대상으로 하지 않습니다.</div>`;
 if(step===1)c.innerHTML=`
 <p class="intro">근로개시일과 업무를 입력하고, 근무요일과 시간을 설정해 주세요.</p>
 <div class="grid three">
 ${field('근로개시일','work.startDate',state.work.startDate,'date','',true)}
 ${field('근무장소','work.place',state.work.place,'text','예) 본점 주방',true)}
 ${field('업무내용','work.duties',state.work.duties,'text','예) 주방 보조',true)}
 </div>
 <div class="section-title">근로시간 및 휴게시간</div><div class="grid">
 ${field('시작 시간','work.startTime',state.work.startTime,'time','',true)}
 ${field('종료 시간','work.endTime',state.work.endTime,'time','',true)}
 ${field('휴게 시작','work.breakStart',state.work.breakStart,'time','')}
 ${field('휴게 종료','work.breakEnd',state.work.breakEnd,'time','')}
 </div>
 <div class="section-title">근무요일 선택</div><div class="day-checks">${dayNames.map(d=>`<label class="day-check"><input type="checkbox" data-day="${d}" ${state.work.days.includes(d)?'checked':''}> ${d}요일</label>`).join('')}</div>
 <div class="grid" style="margin-top:16px">${selectField('주휴일','work.weeklyHoliday',state.work.weeklyHoliday,['일요일','월요일','화요일','수요일','목요일','금요일','토요일','별도 약정'])}</div>
 ${state.workerType==='parttime'?`<div class="section-title">단시간 근로자: 요일별 근로시간</div><p class="hint">근무하는 요일별 시작·종료시간을 입력하세요.</p><table class="day-table"><thead><tr><th>요일</th><th>시작 시간</th><th>종료 시간</th><th>휴게시간</th></tr></thead><tbody>${state.work.days.map(d=>`<tr><th>${d}</th><td><input type="time" data-daytime="${d}:start" value="${esc((state.work.dailyHours[d]||{}).start||state.work.startTime)}"></td><td><input type="time" data-daytime="${d}:end" value="${esc((state.work.dailyHours[d]||{}).end||state.work.endTime)}"></td><td><input type="text" data-daytime="${d}:break" value="${esc((state.work.dailyHours[d]||{}).break||'1시간')}" placeholder="예) 30분"></td></tr>`).join('')}</tbody></table>`:''}
 <div class="notice">근로시간과 휴게시간은 실제 약정 내용에 맞게 입력해 주세요. 법정 기준 적용 여부는 별도로 확인해야 합니다.</div>`;
 if(step===2)c.innerHTML=`
 <p class="intro">임금 지급 조건과 휴가·사회보험 항목을 입력해 주세요.</p>
 <div class="grid">
 ${selectField('임금 형태','pay.type',state.pay.type,['월급','일급','시급'])}
 ${field('임금 금액 (원)','pay.amount',state.pay.amount,'number','금액 입력',true,'min="0"')}
 ${selectField('지급주기','pay.cycle',state.pay.cycle,['매월','매주','매일'])}
 ${selectField('지급일','pay.payDate',state.pay.payDate, state.pay.cycle==='매월'?['매월 5일','매월 10일','매월 15일','매월 25일','매월 말일','직접 입력']:state.pay.cycle==='매주'?['매주 월요일','매주 금요일','매주 토요일','직접 입력']:['근무 당일','직접 입력'])}
 ${selectField('지급방법','pay.method',state.pay.method,['계좌이체','현금'])}
 ${field('상여금','pay.bonus',state.pay.bonus,'text','예) 없음 또는 약정 내용')}
 ${field('기타 수당','pay.allowance',state.pay.allowance,'text','예) 식대, 교통비 등')}
 </div>
 <div class="section-title">휴가</div>
 <div class="grid">${selectField('연차유급휴가','benefits.annualLeave',state.benefits.annualLeave,['법령 기준에 따름','별도 약정'])}</div>
 <div class="section-title">사회보험 가입 여부</div>
 <div class="inline-options">${[['employment','고용보험'],['industrial','산재보험'],['pension','국민연금'],['health','건강보험']].map(([k,l])=>`<label><input type="checkbox" data-insurance="${k}" ${state.benefits.insurance[k]?'checked':''}> ${l}</label>`).join('')}</div>
 <div class="notice">임금 및 사회보험의 실제 적용은 근로조건과 관련 법령에 따라 달라질 수 있습니다.</div>`;
 if(step===3)c.innerHTML=`
 <p class="intro">계약 내용을 확인하고, 아래에서 근로자와 사업주가 각각 서명해 주세요.</p>
 <div class="review-grid">${reviewBlock('사업주 정보',[['사업장',state.employer.name],['대표자',state.employer.representative],['주소',state.employer.address],['연락처',state.employer.phone]])}
 ${reviewBlock('근로자 정보',[['근로자 유형',state.workerType==='regular'?'일반 근로자':'단시간 근로자'],['성명',state.employee.name],['주소',state.employee.address],['연락처',state.employee.phone]])}
 ${reviewBlock('근로조건',[['근로개시일',state.work.startDate],['근무장소',state.work.place],['업무내용',state.work.duties],['근무요일',state.work.days.join(', ')],['근로시간',state.work.startTime+'–'+state.work.endTime],['휴게시간',state.work.breakStart+'–'+state.work.breakEnd],['주휴일',state.work.weeklyHoliday]])}
 ${reviewBlock('임금·휴가·보험',[['임금',state.pay.type+' '+(state.pay.amount?Number(state.pay.amount).toLocaleString()+'원':'미입력')],['지급주기',state.pay.cycle],['지급일',state.pay.payDate],['지급방법',state.pay.method],['상여금',state.pay.bonus],['기타 수당',state.pay.allowance||'없음'],['연차',state.benefits.annualLeave],['사회보험',insuranceText()]])}</div>
 <label class="checkline"><input type="checkbox" id="confirmCheck" ${state.confirmed?'checked':''}> 입력한 계약 내용이 실제 약정과 일치함을 확인했습니다.</label>
 <div class="section-title">서명</div><div class="signature-grid">
 ${signatureMarkup('employee','근로자 서명','근로자 본인이 직접 서명해 주세요.',state.employeeSignature)}
 ${signatureMarkup('employer','사업주 서명','사업주 본인이 직접 서명해 주세요.',state.employerSignature)}
 </div>
 <div class="notice">서명은 마우스 또는 터치로 작성할 수 있습니다. 계약 내용을 수정하면 내용을 다시 확인하고 서명을 새로 받는 것을 권장합니다.</div>`;
 if(step===4)c.innerHTML=`
 <div class="completion">✓ 근로계약서가 완성되었습니다. 계약 내용과 두 서명이 모두 표시되는지 확인하세요.</div>
 <div class="contract" id="contract">${contractHTML()}</div>
 <div class="output-actions no-print">
   <button type="button" class="btn primary" id="savePdfBtn">▣ PDF로 저장 / 인쇄</button>
 </div>
 <div class="output-tip no-print">PDF 저장은 인쇄 화면에서 ‘PDF로 저장’을 선택하세요. 모바일에서 버튼을 눌러도 반응이 없으면 아래 도움말을 확인해 주세요. 계약서 사본은 사업주가 별도로 저장·출력하여 보관해 주세요.</div>
  <div class="output-actions no-print"><button type="button" class="btn hidden" id="mobilePrintHelp">📱 모바일 출력 도움말</button></div>`;
 bindInputs();
 if(step===3)bindCanvases();
 if(step===4){
    const pdfBtn=$('savePdfBtn');
    if(pdfBtn) pdfBtn.addEventListener('click',()=>{
      if(typeof window.print!=='function'){
        alert('이 브라우저에서는 바로 인쇄를 열 수 없습니다. Chrome 앱에서 페이지를 열고 오른쪽 위 ⋮ 메뉴에서 인쇄 기능을 찾아 PDF로 저장해 주세요.');
        return;
      }
      try {
        window.print();
        if(/Android/i.test(navigator.userAgent)){
          const helpBtn=$('mobilePrintHelp');
          if(helpBtn) helpBtn.classList.remove('hidden');
        }
      } catch(err) {
        alert('인쇄 화면을 열지 못했습니다. Chrome 앱에서 페이지를 다시 열고 인쇄를 시도해 주세요.');
      }
    });
    const helpBtn=$('mobilePrintHelp');
    if(helpBtn) helpBtn.addEventListener('click',()=>{
      alert('안드로이드 도움말: 1) 이 페이지를 Chrome 앱에서 엽니다. 2) 오른쪽 위 ⋮ 메뉴를 누릅니다. 3) 인쇄 메뉴를 선택합니다. 4) 프린터 선택에서 “PDF로 저장”을 선택합니다. 메뉴 이름은 기기와 Chrome 버전에 따라 다를 수 있습니다.');
    });
  }
}
function reviewBlock(title,rows){return `<div class="review-block"><h3>${title}</h3><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v||'미입력')}</dd>`).join('')}</dl></div>`}
function insuranceText(){const names={employment:'고용보험',industrial:'산재보험',pension:'국민연금',health:'건강보험'};return Object.entries(state.benefits.insurance).filter(([k,v])=>v).map(([k])=>names[k]).join(', ')||'선택 없음'}
function signatureMarkup(who,title,desc,data){return `<div class="signature-box"><h3>${title}</h3><p>${desc}</p><canvas class="signature" id="${who}Canvas" width="900" height="340" aria-label="${title} 입력 영역"></canvas><div class="sig-actions"><span class="sig-status ${data?'ok':''}" id="${who}Status">${data?'✓ 서명 저장됨':'서명 대기'}</span><button class="btn" type="button" data-clear="${who}">다시 쓰기</button></div></div>`}
function contractHTML(){
 const s=state;const worker=s.workerType==='regular'?'일반 근로자':'단시간 근로자';
 const workdays=s.work.days.join('·')+'요일';
 const details=s.workerType==='parttime'?`<p>근로일별 근로시간: ${s.work.days.map(d=>`${d} ${((s.work.dailyHours[d]||{}).start)||s.work.startTime}–${((s.work.dailyHours[d]||{}).end)||s.work.endTime}`).join(' / ')}</p>`:'';
 const sig=(data,alt)=>data?`<img src="${data}" alt="${alt} 서명">`:'<div style="height:58px"></div>';
 return `<h2>근 로 계 약 서</h2>
 <p>사업주와 근로자는 다음과 같이 근로조건을 확인합니다. 아래 내용은 입력한 정보를 바탕으로 작성되었습니다.</p>
 <table class="contract-table">
 <tr class="info-section"><th colspan="4">Ⅰ. 사업주 및 사업장 정보</th></tr>
 <tr><th>사업장명</th><td>${esc(s.employer.name)}</td><th>대표자</th><td>${esc(s.employer.representative)}</td></tr>
 <tr><th>사업장 주소</th><td colspan="3">${esc(s.employer.address)}</td></tr><tr><th>사업주 연락처</th><td colspan="3">${esc(s.employer.phone)}</td></tr>
 <tr class="info-section"><th colspan="4">Ⅱ. 근로자 정보</th></tr>
 <tr><th>근로자 성명</th><td>${esc(s.employee.name)}</td><th>근로자 유형</th><td>${worker}</td></tr><tr><th>근로자 주소</th><td colspan="3">${esc(s.employee.address)}</td></tr><tr><th>근로자 연락처</th><td colspan="3">${esc(s.employee.phone)}</td></tr></table>
 <ol><li><strong>근로개시일</strong>: ${esc(s.work.startDate||'미입력')}</li>
 <li><strong>근무장소</strong>: ${esc(s.work.place)}</li><li><strong>업무내용</strong>: ${esc(s.work.duties)}</li>
 <li><strong>근로시간 및 휴게시간</strong>: 근로시간 ${esc(s.work.startTime)}~${esc(s.work.endTime)}, 휴게시간 ${esc(s.work.breakStart)}~${esc(s.work.breakEnd)}.</li>
 <li><strong>근무일 및 휴일</strong>: 근무요일 ${esc(workdays)}. 주휴일 ${esc(s.work.weeklyHoliday)}. ${details}</li>
 <li><strong>임금</strong>: ${esc(s.pay.type)} ${esc(s.pay.amount?Number(s.pay.amount).toLocaleString()+'원':'미입력')}. 지급주기 ${esc(s.pay.cycle)}, 지급일 ${esc(s.pay.payDate)}, 지급방법 ${esc(s.pay.method)}. 상여금 ${esc(s.pay.bonus||'미입력')}, 기타 수당 ${esc(s.pay.allowance||'없음')}.</li>
 <li><strong>연차유급휴가</strong>: ${esc(s.benefits.annualLeave)}.</li><li><strong>사회보험</strong>: ${esc(insuranceText())}.</li>
 <li><strong>근로계약서 교부</strong>: 사업주는 근로계약서를 작성하여 근로자에게 교부합니다.</li><li><strong>기타</strong>: 본 계약서에 명시되지 않은 사항은 관련 법령 및 당사자 간의 적법한 약정에 따릅니다.</li></ol>
 <p style="text-align:right">계약일: ${esc(new Date().toISOString().slice(0,10))}</p>
 <div class="signatures-print"><div class="print-sign"><strong>근로자: ${esc(s.employee.name)}</strong><br>서명 ${sig(s.employeeSignature,'근로자')}</div><div class="print-sign"><strong>사업주: ${esc(s.employer.representative)}</strong><br>서명 ${sig(s.employerSignature,'사업주')}</div></div>
 <p style="margin-top:24px;font-size:11px;color:#374151">※ 실제 사용 전 근로조건 및 법정 필수 기재사항을 확인하세요. 이 문서는 입력된 정보를 정리한 초안입니다.</p>`;
}
function bindInputs(){
 document.querySelectorAll('[data-worker]').forEach(b=>b.addEventListener('click',()=>{state.workerType=b.dataset.worker;render()}));
 document.querySelectorAll('[data-path^="employer."]').forEach(el=>el.addEventListener('input',()=>{
  const key=el.dataset.path.split('.')[1]; state.employer[key]=el.value; saveEmployerInfo();
 }));
 document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('change',()=>{
 const [group,key]=el.dataset.path.split('.');state[group][key]=el.value;
 if(group==='employer') saveEmployerInfo();
 if(el.dataset.path==='pay.cycle'){
 if(el.value==='매월')state.pay.payDate='매월 10일';else if(el.value==='매주')state.pay.payDate='매주 월요일';else state.pay.payDate='근무 당일';
 render();
 } else if(el.dataset.path==='pay.payDate'&&el.value==='직접 입력'){
 const v=prompt('약정한 지급일을 입력해 주세요.',state.pay.payDate);if(v)state.pay.payDate=v;render();
 } else if(el.dataset.path==='benefits.annualLeave'){}
 }));
 document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('change',()=>{
 const d=el.dataset.day;state.work.days=el.checked?[...new Set([...state.work.days,d])].sort((a,b)=>dayNames.indexOf(a)-dayNames.indexOf(b)):state.work.days.filter(x=>x!==d);render();
 }));
 document.querySelectorAll('[data-daytime]').forEach(el=>el.addEventListener('change',()=>{
 const [d,k]=el.dataset.daytime.split(':');state.work.dailyHours[d]=state.work.dailyHours[d]||{};state.work.dailyHours[d][k]=el.value;
 }));
 document.querySelectorAll('[data-insurance]').forEach(el=>el.addEventListener('change',()=>state.benefits.insurance[el.dataset.insurance]=el.checked));
 const cc=$('confirmCheck');if(cc)cc.addEventListener('change',()=>state.confirmed=cc.checked);
 document.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.clear==='employee'?'employeeSignature':'employerSignature']='';const canvas=$(b.dataset.clear+'Canvas');const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);$(b.dataset.clear+'Status').textContent='서명 대기';$(b.dataset.clear+'Status').classList.remove('ok')}));
}
function bindCanvases(){
 ['employee','employer'].forEach(who=>{
 const canvas=$(who+'Canvas'),ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#152b4c';
 if(state[who+'Signature']){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=state[who+'Signature']}
 let drawing=false,hasDrawn=!!state[who+'Signature'];
 function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
 canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();hasDrawn=true;e.preventDefault()});
 canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()});
 const finish=()=>{if(!drawing)return;drawing=false;if(hasDrawn){state[who+'Signature']=canvas.toDataURL('image/png');const st=$(who+'Status');st.textContent='✓ 서명 저장됨';st.classList.add('ok')}};
 canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('pointerleave',e=>{if(drawing&&e.buttons===0)finish()});
 });
}
function validateStep(){
 if(step===0){
 const required=[['employer','name','사업장명'],['employer','representative','대표자명'],['employer','address','사업장 주소'],['employer','phone','사업주 연락처'],['employee','name','근로자 성명'],['employee','phone','근로자 연락처']];
 const missing=required.find(([g,k])=>!state[g][k].trim());if(missing){alert(missing[2]+'을(를) 입력해 주세요.');return false}
 }else if(step===1){
 const req=[['startDate','근로개시일'],['place','근무장소'],['duties','업무내용']];const m=req.find(([k])=>!state.work[k]);if(m){alert(m[1]+'을(를) 입력해 주세요.');return false}
 if(!state.work.days.length){alert('근무요일을 하나 이상 선택해 주세요.');return false}
 }else if(step===2){if(!state.pay.amount||Number(state.pay.amount)<=0){alert('임금 금액을 입력해 주세요.');return false}}
 else if(step===3){if(!state.confirmed){alert('계약 내용을 확인했다는 항목을 체크해 주세요.');return false}if(!state.employeeSignature||!state.employerSignature){alert('근로자와 사업주 서명을 모두 작성해 주세요.');return false}}
 return true;
}
$('backBtn').addEventListener('click',()=>{if(step>0){step--;render()}});
$('nextBtn').addEventListener('click',()=>{if(step===4){step=0;state.confirmed=false;render();return}if(!validateStep())return;step++;render();window.scrollTo({top:0,behavior:'smooth'})});
render();
</script>
</body>
</html>
